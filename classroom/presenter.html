<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>课堂扫码作答</title><link rel="stylesheet" href="presenter.css?v=20261107-sessions"><link rel="stylesheet" href="comparison.css?v=20261107-sessions"><script defer src="config.js"></script><script defer src="api.js?v=20261107-sessions" data-qo-role="teacher"></script><script defer src="vendor/qrcode.js"></script><script defer src="comparison-view.js?v=20261107-sessions"></script><script defer src="presenter.js?v=20261107-sessions"></script></head><body>
<main>
 <section id="connection" hidden><p class="heading">课前连接课堂</p><form id="connect"><label>教师口令<input type="password" name="password" autocomplete="current-password" required maxlength="200"></label><button type="submit">连接课堂</button></form><button id="dev-connect" hidden>本机演示连接</button></section>
 <section id="classroom" hidden>
  <div id="join"><p class="heading">扫码作答</p><a id="student-link" target="_blank" rel="noopener" aria-label="打开学生作答页"><img id="cached-qr" alt="学生作答二维码" hidden><canvas id="qr" aria-label="学生作答二维码"></canvas></a></div>
  <section id="results" aria-label="全班答题情况" hidden><div class="result-heading"><p class="heading">各轮选择分布</p><div id="chart-modes" class="chart-modes" role="group" aria-label="分布图样式" hidden><button id="mode-bars" type="button" aria-pressed="true">柱状</button><button id="mode-profile" type="button" aria-pressed="false">轮廓</button></div></div><div id="bars"></div><section id="ai-brief" class="ai-brief" aria-live="polite"></section></section>
  <div class="class-tools"><p id="session-label" aria-live="polite"></p><button id="new-class" class="secondary" type="button" disabled>开始新课</button><button id="new-trial" class="secondary" type="button" disabled>试答</button></div>
  <div id="new-confirm" hidden><p id="confirm-note"></p><div class="confirm-actions"><button id="confirm-class" type="button">确认切换</button><button id="cancel-class" class="secondary" type="button">取消</button></div></div>
  <div class="status-row"><p id="timer" class="timer" aria-live="off">等待发题</p><p id="participation" class="participation"></p></div>
  <label class="feedback-mode">反馈时机<select id="feedback-mode" disabled><option value="discussion">讨论题 · 展示后反馈</option><option value="self-check">单轮自查 · 提交后反馈</option></select></label>
  <div class="actions"><button id="start" type="button" disabled>开始回答</button><button id="show" class="secondary" type="button" disabled>展示结果</button></div>
 </section>
 <p id="message" role="status" aria-live="polite"></p><button id="retry" class="secondary" type="button" hidden>重新连接</button>
</main></body></html>
