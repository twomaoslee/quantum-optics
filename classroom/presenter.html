<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>课堂扫码作答</title><link rel="stylesheet" href="presenter.css?v=20261101-inline2"><script defer src="config.js"></script><script defer src="api.js?v=20261101-inline2" data-qo-role="teacher"></script><script defer src="vendor/qrcode.js"></script><script defer src="presenter.js?v=20261101-inline2"></script></head><body>
<main>
 <section id="connection" hidden><p class="heading">课前连接课堂</p><form id="connect"><label>教师口令<input type="password" name="password" autocomplete="current-password" required maxlength="200"></label><button type="submit">连接课堂</button></form><button id="dev-connect" hidden>本机演示连接</button></section>
 <section id="classroom" hidden>
  <div id="join"><p class="heading">扫码作答</p><a id="student-link" target="_blank" rel="noopener" aria-label="打开学生作答页"><canvas id="qr" aria-label="学生作答二维码"></canvas></a></div>
  <section id="results" aria-label="全班答题情况" hidden><p class="heading">全班回答</p><div id="bars"></div></section>
  <p id="timer" class="timer" aria-live="off">等待发题</p><p id="participation" class="participation"></p>
  <div class="actions"><button id="start" type="button">开始 · 60秒</button><button id="show" class="secondary" type="button" disabled>展示回答</button></div>
 </section>
 <p id="message" role="status" aria-live="polite"></p><button id="retry" class="secondary" type="button" hidden>重新连接</button>
</main></body></html>
