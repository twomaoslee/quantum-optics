<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hadamard 门与布洛赫球</title><link rel="stylesheet" href="hadamard.css"><script>window.MathJax={tex:{inlineMath:[['\\(','\\)']],displayMath:[['\\[','\\]']]},options:{enableMenu:false}};</script><script defer src="../mathjax/tex-svg-full.js"></script><script defer src="hadamard.js"></script></head>
<body><main id="stage">
<div class="toolbar"><span>初态</span><button id="zero" aria-pressed="true">0态</button><button id="one" aria-pressed="false">1态</button><button id="apply" class="primary">施加 H 门</button><button id="reset">重置初态</button><span class="spacer"></span><button id="full">全屏 ↗</button></div>
<div class="layout">
<section class="geometry"><div class="figure-label">布洛赫球旋转示意</div><svg id="sphere" viewBox="0 0 500 400" role="img" aria-label="当前量子态的布洛赫向量与已走过的轨迹"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="#0070c0"/></marker></defs><circle cx="240" cy="200" r="164" fill="#f5f9fc" stroke="#a6c5db" stroke-width="1.5"/><g id="grid" fill="none" stroke="#c3d6e5" stroke-width="1.3"></g><g id="axes" stroke="#adbfce" stroke-width="1.3"></g><polyline id="trail" fill="none" stroke="#0070c0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/><circle id="trail-start" r="5" fill="#fff" stroke="#0070c0" stroke-width="2" style="display:none"/><line id="vector" x1="240" y1="200" stroke="#0070c0" stroke-width="5" marker-end="url(#arrow)"/><circle id="tip" r="6" fill="#0070c0"/></svg>
<div class="current" aria-live="polite"><span>当前态</span><span id="ket0">\(|0\rangle\)</span><span id="ket1" hidden>\(|1\rangle\)</span><span id="ketplus" hidden>\(|+\rangle\)</span><span id="ketminus" hidden>\(|-\rangle\)</span><span id="moving" hidden>门操作中</span></div></section>
<section class="rules"><div id="rule0" class="rule selected"><h3>0态 → 加号态</h3><div class="equation">\[U_{\mathrm H}|0\rangle=|+\rangle=\frac{|0\rangle+|1\rangle}{\sqrt2}\]</div></div><div id="rule1" class="rule"><h3>1态 → 减号态</h3><div class="equation">\[U_{\mathrm H}|1\rangle=|-\rangle=\frac{|0\rangle-|1\rangle}{\sqrt2}\]</div></div><div id="probability" class="probability" hidden>测0/1：\(P(0)=P(1)=\frac12\)</div></section>
</div><div id="conclusion" hidden>两种输出态测0/1都各半；相对相位不同，对应球上的相反方向。</div>
</main></body></html>
