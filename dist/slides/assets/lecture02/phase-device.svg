<svg xmlns="http://www.w3.org/2000/svg" width="960" height="368" viewBox="0 0 960 368" role="img" aria-labelledby="title"><title id="title">主轴固定的可调相位延迟元件</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#0070c0" stroke-width="1.5"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="28" y="40" font-size="28" fill="#0070c0" text-anchor="start" font-weight="bold">用可调延迟元件改变相对相位</text><rect x="25" y="122" width="175" height="134" rx="8" fill="#eaf3fa" stroke="#c3d6e5"/><text x="112" y="171" font-size="26" fill="#0070c0" text-anchor="middle" font-weight="normal">正45°制备</text><text x="112" y="214" font-size="24" fill="#202a33" text-anchor="middle" font-weight="normal">H、V等权</text><line x1="200" y1="188" x2="285" y2="188" stroke="#0070c0" stroke-width="3" marker-end="url(#arrow)"/><rect x="295" y="89" width="330" height="204" rx="8" fill="#eaf3fa" stroke="#c3d6e5"/><text x="460" y="131" font-size="25" fill="#0070c0" text-anchor="middle" font-weight="normal">主轴固定为H/V</text><text x="460" y="181" font-size="24" fill="#202a33" text-anchor="middle" font-weight="normal">H分量：增加相位 δH</text><text x="460" y="225" font-size="24" fill="#202a33" text-anchor="middle" font-weight="normal">V分量：增加相位 δV</text><text x="460" y="270" font-size="22" fill="#617585" text-anchor="middle" font-weight="normal">调节两分量的光程差</text><line x1="625" y1="188" x2="702" y2="188" stroke="#0070c0" stroke-width="3" marker-end="url(#arrow)"/><rect x="711" y="123" width="222" height="132" rx="8" fill="#fff" stroke="#c3d6e5"/><text x="822" y="166" font-size="25" fill="#202a33" text-anchor="middle" font-weight="normal">输出相对相位</text><text x="822" y="214" font-size="28" fill="#0070c0" text-anchor="middle" font-weight="normal">φ = δV − δH</text><text x="30" y="337" font-size="23" fill="#617585" text-anchor="start" font-weight="normal">模保持不变 → H/V计数不变；相位差改变 → 其他分析可能改变。</text></g></svg>