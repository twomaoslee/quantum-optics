<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>相位调控课堂交互</title><link rel="stylesheet" href="../vendor/katex/katex.min.css"><link rel="stylesheet" href="phase-classroom.css"><script defer src="../vendor/katex/katex.min.js"></script><script defer src="phase-classroom.js"></script></head><body><main id="slide" aria-label="调节相位，比较叠加与混合">
<header><label for="mode">输入</label><select id="mode"><option value="pure">45°偏振：相干叠加</option><option value="mixed">随机H/V：各半</option></select><label for="phase">相位</label><input id="phase" type="range" min="0" max="360" step="1" value="0" aria-label="V相对H的相位，单位为度"><output id="degrees"></output><div class="presets"><button type="button" data-phase="0" aria-label="相位0度"><span class="math" data-math="0"></span></button><button type="button" data-phase="90" aria-label="相位90度"><span class="math" data-math="\pi/2"></span></button><button type="button" data-phase="180" aria-label="相位180度"><span class="math" data-math="\pi"></span></button><button type="button" data-phase="270" aria-label="相位270度"><span class="math" data-math="3\pi/2"></span></button></div><button id="fullscreen" type="button">放大</button></header><section class="state-strip"><span>延迟元件输出</span><div class="pure-only"><span class="math" data-math="\displaystyle |\psi_\phi\rangle=\frac{|H\rangle+e^{i\phi}|V\rangle}{\sqrt2}"></span></div><div class="mixed-only">H或V各占一半，改变相位不改变混合态。</div></section><section class="workspace"><div class="pure-only phasors"><section class="outlet"><h2>+ 出口 <small>两项相加</small></h2><svg id="plus-svg" viewBox="0 0 440 200" role="img" aria-label="+出口概率幅的复平面矢量相加"></svg><div class="equation"><span class="math" data-math="\displaystyle a_+=\frac12+\frac{e^{i\phi}}2"></span></div><div class="barrow"><span class="math" data-math="P(+)"></span><div class="track"><div id="plus-bar" class="bar"></div></div><output id="plus-value"></output></div></section><section class="outlet"><h2>- 出口 <small>第二项带负号</small></h2><svg id="minus-svg" viewBox="0 0 440 200" role="img" aria-label="-出口概率幅的复平面矢量相加"></svg><div class="equation"><span class="math" data-math="\displaystyle a_-=\frac12-\frac{e^{i\phi}}2"></span></div><div class="barrow"><span class="math" data-math="P(-)"></span><div class="track"><div id="minus-bar" class="bar"></div></div><output id="minus-value"></output></div></section></div><div class="mixed-only mixture"><section><h2>先分别计算，再加权</h2><p>每次输入H或V中的一种。</p><p>延迟元件只给该态增加整体相位。</p><p>两类输入的概率各按一半计入。</p></section><section class="mix-calculation"><span class="math" data-math="\displaystyle P(+)=\frac12 P(+|H)+\frac12 P(+|V)=\frac12"></span><span class="math" data-math="\displaystyle P(-)=\frac12 P(-|H)+\frac12 P(-|V)=\frac12"></span><p>两个出口始终各占50%</p></section></div></section><footer><div class="hv-reference">H/V对照：<span class="math" data-math="P(H)=P(V)=1/2"></span></div><div class="pure-only legend"><span class="h-item">H项</span><span class="v-item">V项</span><span class="sum-item">总概率幅</span><span>（复平面）</span></div><span class="mixed-only">两组测量分别使用新样本</span></footer>
<div hidden id="pm-note"></div><div hidden id="h-bar"></div><div hidden id="v-bar"></div><output hidden id="h-value"></output><output hidden id="v-value"></output></main></body></html>
