<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三组自旋测量比较</title>
<link rel="stylesheet" href="../vendor/katex/katex.min.css"><link rel="stylesheet" href="spin-classroom.css">
<script defer src="../vendor/katex/katex.min.js"></script><script defer src="spin-classroom.js"></script></head>
<body><main id="slide">
<div class="controls"><p>每组：1000个 <span data-math="|z+\rangle"></span></p><label for="reference">比例按</label><select id="reference"><option value="initial">初始样本</option><option value="last">末台入射样本</option></select><button id="reveal-all">全部揭示</button><button id="reset">重置</button><button id="fullscreen">全屏</button></div>
<div id="experiments" aria-label="保持输入相同，比较直接测z、改测x和保留x正支后再测z"></div>
<footer><span id="basis-note">先比较前两组，再预测第三组。</span><span class="expected">计数为理论期望</span></footer>
</main></body></html>
