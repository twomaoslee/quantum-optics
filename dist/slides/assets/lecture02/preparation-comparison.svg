<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title"><title id="title">相干正45度制备与随机HV制备的统计比较</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#0070c0" stroke-width="1.5" /></marker></defs><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="39" font-size="28" fill="#0070c0" text-anchor="start" font-weight="bold">保持制备方式，分别使用两组分析</text><text x="472" y="90" font-size="26" fill="#0070c0" text-anchor="middle" font-weight="normal">H/V分析</text><text x="777" y="90" font-size="26" fill="#0070c0" text-anchor="middle" font-weight="normal">正／负45°分析</text><rect x="20" y="117" width="920" height="168" rx="8" fill="#eaf3fa" stroke="#c3d6e5" /><text x="40" y="174" font-size="26" fill="#202a33" text-anchor="start" font-weight="bold">A：固定正45°</text><text x="40" y="213" font-size="22" fill="#617585" text-anchor="start" font-weight="normal">每次同一种制备</text><text x="370" y="171" font-size="22" fill="#202a33" text-anchor="start" font-weight="normal">H</text><rect x="406" y="150" width="126" height="23" rx="0" fill="#d9e4ed" stroke="none" /><rect x="406" y="150" width="63.0" height="23" rx="0" fill="#0070c0" stroke="none" /><text x="550" y="170" font-size="24" fill="#0070c0" text-anchor="start" font-weight="normal">50%</text><text x="370" y="226" font-size="22" fill="#202a33" text-anchor="start" font-weight="normal">V</text><rect x="406" y="205" width="126" height="23" rx="0" fill="#d9e4ed" stroke="none" /><rect x="406" y="205" width="63.0" height="23" rx="0" fill="#617585" stroke="none" /><text x="550" y="225" font-size="24" fill="#0070c0" text-anchor="start" font-weight="normal">50%</text><text x="675" y="171" font-size="22" fill="#202a33" text-anchor="start" font-weight="normal">+</text><rect x="711" y="150" width="126" height="23" rx="0" fill="#d9e4ed" stroke="none" /><rect x="711" y="150" width="126" height="23" rx="0" fill="#0070c0" stroke="none" /><text x="855" y="170" font-size="24" fill="#0070c0" text-anchor="start" font-weight="normal">100%</text><text x="675" y="226" font-size="22" fill="#202a33" text-anchor="start" font-weight="normal">−</text><rect x="711" y="205" width="126" height="23" rx="0" fill="#d9e4ed" stroke="none" /><rect x="711" y="205" width="0" height="23" rx="0" fill="#617585" stroke="none" /><text x="855" y="225" font-size="24" fill="#0070c0" text-anchor="start" font-weight="normal">0%</text><rect x="20" y="305" width="920" height="168" rx="8" fill="#eaf3fa" stroke="#c3d6e5" /><text x="40" y="362" font-size="26" fill="#202a33" text-anchor="start" font-weight="bold">B：随机H或V</text><text x="40" y="401" font-size="22" fill="#617585" text-anchor="start" font-weight="normal">两类制备各占一半</text><text x="370" y="359" font-size="22" fill="#202a33" text-anchor="start" font-weight="normal">H</text><rect x="406" y="338" width="126" height="23" rx="0" fill="#d9e4ed" stroke="none" /><rect x="406" y="338" width="63.0" height="23" rx="0" fill="#0070c0" stroke="none" /><text x="550" y="358" font-size="24" fill="#0070c0" text-anchor="start" font-weight="normal">50%</text><text x="370" y="414" font-size="22" fill="#202a33" text-anchor="start" font-weight="normal">V</text><rect x="406" y="393" width="126" height="23" rx="0" fill="#d9e4ed" stroke="none" /><rect x="406" y="393" width="63.0" height="23" rx="0" fill="#617585" stroke="none" /><text x="550" y="413" font-size="24" fill="#0070c0" text-anchor="start" font-weight="normal">50%</text><text x="675" y="359" font-size="22" fill="#202a33" text-anchor="start" font-weight="normal">+</text><rect x="711" y="338" width="126" height="23" rx="0" fill="#d9e4ed" stroke="none" /><rect x="711" y="338" width="63.0" height="23" rx="0" fill="#0070c0" stroke="none" /><text x="855" y="358" font-size="24" fill="#0070c0" text-anchor="start" font-weight="normal">50%</text><text x="675" y="414" font-size="22" fill="#202a33" text-anchor="start" font-weight="normal">−</text><rect x="711" y="393" width="126" height="23" rx="0" fill="#d9e4ed" stroke="none" /><rect x="711" y="393" width="63.0" height="23" rx="0" fill="#617585" stroke="none" /><text x="855" y="413" font-size="24" fill="#0070c0" text-anchor="start" font-weight="normal">50%</text><text x="25" y="510" font-size="23" fill="#617585" text-anchor="start" font-weight="normal">各组分析使用重新制备的样本。</text></g></svg>