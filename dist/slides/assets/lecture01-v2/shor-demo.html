 $('#title').textContent=['同一相干运算：指数 x → 余数 2ˣ mod N','考察余数读出1的条件分支','傅里叶变换后，按精确概率随机读出 k'][s];
 $('#description').textContent=[`图示前64项。第一寄存器有 ${data.Q} 个指数标签，第二寄存器保存相应余数。`,`保留余数为1的指数，其余幅度为0。图示前128个标签；所有保留项归一化。`,`横轴为 k / Q。${data.Q>1024?`相邻${data.Q/1024}个结果合为一组显示；抽样仍使用全部${data.Q}个结果。`:'每根柱对应一个读出结果。'}`][s];
 $('#plot').setAttribute('aria-label',[$('#title').textContent,'余数为1条件分支的概率幅','傅里叶变换后的概率分布'][s]);draw();
}
function reset(){data=DATA.find(d=>d.N===Number($('#N').value));shots=0;denominators=new Set();found=false;$('#meta').textContent=`Q = ${data.Q}（${Math.log2(data.Q)}个指数比特）`;$('#shots').textContent='尚未抽样';$('#result').textContent='依次观察模幂关系、条件态与傅里叶概率。周期由读出样本提出并检验。';setStep(0);}
function sample(){let u=Math.random(),k=0;for(;k<data.p.length-1;k++){u-=data.p[k];if(u<=0)break;}shots++;
 let conv=cf(k,data.Q,data.N),near=conv.filter(([s,q])=>Math.abs(k/data.Q-s/q)<=1/(2*data.Q)),candidateText=near.map(([s,q])=>`${s}/${q}`).join('、');
 for(let [s,q]of near)denominators.add(q);
 const pool=new Set(denominators);let accum=1;for(const q of denominators){accum=accum/gcd(accum,q)*q;if(accum<=data.N)pool.add(accum);else break;}
 let verified=[...pool].filter(q=>q<data.N&&modpow(2,q,data.N)===1).sort((a,b)=>a-b),success=null;
 for(const q of verified)if(q%2===0){let z=modpow(2,q/2,data.N),g=gcd(z-1,data.N);if(g>1&&g<data.N){success={q,g};break;}}
 $('#shots').textContent=`已抽样 ${shots} 次`;
 let first=`本次 k = ${k}：${k}/${data.Q} ≈ ${(k/data.Q).toFixed(6)}。`+(candidateText?` 连分数近似：${candidateText}。`:'');
 found=Boolean(success);if(success){$('#result').innerHTML=first+`<br><strong>候选周期 ${success.q}${denominators.has(success.q)?'':'（合并已有分母）'} 检验通过：2<sup>${success.q}</sup> mod ${data.N} = 1；提取因子 ${success.g} × ${data.N/success.g} = ${data.N}。</strong>`;}
 else $('#result').textContent=first+(candidateText?'':' 本次没有给出有用分母。')+' 尚未通过因子检验，请继续抽样；合并已有候选分母的最小公倍数后再检验。';
 return found;
}
$('#N').addEventListener('change',reset);$('#reset').addEventListener('click',reset);document.querySelectorAll('[data-step]').forEach(b=>b.addEventListener('click',()=>setStep(Number(b.dataset.step))));$('#sample').addEventListener('click',sample);$('#batch').addEventListener('click',()=>{for(let i=0;i<10;i++)if(sample())break;});window.addEventListener('resize',draw);reset();
</script></html>
