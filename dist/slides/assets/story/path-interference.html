<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>同一双缝实验：相位与路径记录</title>
<style>*{box-sizing:border-box}body{margin:0;background:white;color:#202122;font:36px/1.35 "Source Sans Pro","PingFang SC","Microsoft YaHei",sans-serif}main{padding:8px 14px;height:563px}canvas{display:block;width:100%;height:345px}label{color:#0070c0}button{font:inherit;background:#f1f4f8;border:1px solid #83afc8;border-radius:4px;color:#0070c0;padding:7px 18px;cursor:pointer}button[aria-pressed=true]{background:#0070c0;color:white}.row{display:flex;align-items:center;gap:18px;margin:20px 0 12px}input{width:370px;accent-color:#0070c0}p{margin:16px 0}output{font-variant-numeric:tabular-nums}.hint{font-size:32px} [hidden]{display:none!important}</style>
<main><canvas id="scene" width="1200" height="345" role="img" aria-label="双缝路径示意与屏幕计数曲线"></canvas>
<div class="row" id="phase-controls"><label for="phase">下路相位：<output id="angle">0°</output></label><input id="phase" type="range" min="0" max="360" value="0"><button data-angle="0">0°</button><button data-angle="90">90°</button><button data-angle="180">180°</button></div>
<div class="row" id="record-controls" hidden><span>两路始终开放</span><button id="unmarked" aria-pressed="true">不记录路径</button><button id="marked" aria-pressed="false">完整记录路径</button></div>
<p id="message"></p><p class="hint" id="hint"></p></main>
<script>
const measured=new URLSearchParams(location.search).get('mode')==='measurement';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),slider=document.querySelector('#phase');let record=false;
document.querySelector('#phase-controls').hidden=measured;document.querySelector('#record-controls').hidden=!measured;
function relativeCount(x,phase,visibility){return .5*Math.exp(-x*x/4)*(1+visibility*Math.cos(2*Math.PI*x+phase));}
function stroke(points,color,width=3,dash=[]){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.setLineDash(dash);ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.stroke();ctx.setLineDash([])}
function txt(s,x,y,color='#202122',size=29){ctx.fillStyle=color;ctx.font=size+'px "PingFang SC",sans-serif';ctx.textAlign='left';ctx.fillText(s,x,y)}
function draw(){const phase=Number(slider.value)*Math.PI/180,v=record?0:1;ctx.clearRect(0,0,1200,345);txt('同一个双缝装置',20,35,'#0070c0',32);txt('屏上的相对计数',620,35,'#0070c0',32);
ctx.fillStyle='#0070c0';ctx.beginPath();ctx.arc(50,178,8,0,2*Math.PI);ctx.fill();txt('电子源',8,310);for(const [a,b] of [[65,111],[139,218],[246,295]])stroke([[215,a],[215,b]],'#899197',7);
stroke([[460,64],[460,295]],'#596772',4);txt('屏幕',420,334);
for(const [y,c,label] of [[125,'#0070c0','上路'],[232,'#cf8031','下路']]){stroke([[50,178],[215,y],[456,178]],c,3,[7,5]);txt(label,232,y+(y<178?-17:39),c);if(record){ctx.fillStyle='#e7edf3';ctx.fillRect(276,y-19,104,38);txt(y<178?'记录上路':'记录下路',279,y+8,c,24)}}
if(!measured){ctx.fillStyle='#cf8031';ctx.fillRect(297,209,8,45);txt('调相位',303,299,'#cf8031',25)}
const left=616,right=1170,base=300,height=220;stroke([[left,63],[left,base],[right,base]],'#899197',2);txt('屏幕上的位置',776,338,'#596772',28);
const points=[];for(let i=0;i<=600;i++){const x=-3+6*i/600;points.push([left+(right-left)*i/600,base-height*relativeCount(x,phase,v)])}stroke(points,'#0070c0',4);
if(!measured){const ref=[];for(let i=0;i<=600;i++){const x=-3+6*i/600;ref.push([left+(right-left)*i/600,base-height*relativeCount(x,0,1)])}stroke(ref,'#b7c6d1',1.5,[5,5]);txt('灰虚线：初始条纹',854,68,'#596772',24)}
document.querySelector('#angle').textContent=slider.value+'°';document.querySelector('#message').textContent=measured?(record?'装置能够区分路径：屏幕上的干涉条纹消失。':'没有可区分的路径记录：屏幕上出现干涉条纹。'):'改变相位，就改变哪些位置容易出现电子。';
document.querySelector('#hint').textContent=measured?'电子路径与装置记录关联起来；无需人读取记录。':'相位描述两路波动的相对进度；调节后，条纹随之移动。';
canvas.setAttribute('aria-label',`理想双缝模型，相位${slider.value}度，${record?'完整路径记录，干涉消失':'不区分路径，有干涉'}，中心相对计数${relativeCount(0,phase,v).toFixed(3)}`);
window.modelState={phase:Number(slider.value),visibility:v,center:relativeCount(0,phase,v)};}
slider.addEventListener('input',draw);document.querySelectorAll('[data-angle]').forEach(b=>b.onclick=()=>{slider.value=b.dataset.angle;draw()});
for(const id of ['unmarked','marked'])document.getElementById(id).onclick=()=>{record=id==='marked';document.getElementById('unmarked').setAttribute('aria-pressed',String(!record));document.getElementById('marked').setAttribute('aria-pressed',String(record));draw()};
window.relativeCount=relativeCount;draw();
</script></html>
