<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>相位与两个输出的概率</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#202122;font:32px/1.45 "Source Sans Pro","PingFang SC","Microsoft YaHei",sans-serif}main{height:550px;display:grid;grid-template-columns:390px 1fr;gap:30px;padding:24px}h2{font-size:36px;color:#0070c0;margin:0 0 25px}p{margin:16px 0}input{width:100%;accent-color:#0070c0}button{font:inherit;border:1px solid #83afc8;background:#f1f4f8;padding:9px 16px;margin-right:8px;color:#0070c0;cursor:pointer}output{font-variant-numeric:tabular-nums;color:#0070c0}canvas{width:100%;height:410px}.minor{font-size:25px;color:#586570}label{display:block;margin-top:25px}.sum{text-align:center;font-size:30px}.controls{align-self:center}
</style>
<main><div class="controls"><h2>改变两条路径的相对相位</h2><p>输入相同，只改变相位。</p><label for="phase">相位：<output id="angle">0°</output></label><input id="phase" type="range" min="0" max="360" step="1" value="0"><p><button data-angle="0">0°</button><button data-angle="90">90°</button><button data-angle="180">180°</button></p><p class="minor">一个输出增强时，另一个输出减弱。</p></div><div><canvas id="chart" width="780" height="410" aria-label="两个输出的概率柱状图" role="img"></canvas><p class="sum">两种结果的概率相加 = <output>100%</output></p></div></main>
<script>
const slider=document.querySelector('#phase'),ctx=document.querySelector('canvas').getContext('2d');
function draw(){const phi=Number(slider.value)*Math.PI/180;const prob=[(1+Math.cos(phi))/2,(1-Math.cos(phi))/2];document.querySelector('#angle').textContent=slider.value+'°';ctx.clearRect(0,0,780,410);ctx.font='27px "PingFang SC",sans-serif';ctx.textAlign='right';ctx.fillStyle='#586570';ctx.fillText('概率',75,32);for(let k=0;k<=4;k++){const y=340-k*70;ctx.strokeStyle='#e5e9ed';ctx.beginPath();ctx.moveTo(100,y);ctx.lineTo(750,y);ctx.stroke();ctx.fillText(k*25+'%',85,y+9)}for(let i=0;i<2;i++){const x=195+i*320;ctx.fillStyle=i?'#cf8031':'#0070c0';ctx.fillRect(x,340-280*prob[i],160,280*prob[i]);ctx.textAlign='center';ctx.fillStyle='#202122';ctx.font='34px "PingFang SC",sans-serif';ctx.fillText((prob[i]*100).toFixed(1)+'%',x+80,Math.max(45,320-280*prob[i]));ctx.fillText('输出 '+i,x+80,390)}document.querySelector('canvas').setAttribute('aria-label',`输出0概率${(prob[0]*100).toFixed(1)}%，输出1概率${(prob[1]*100).toFixed(1)}%`)}slider.addEventListener('input',draw);document.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{slider.value=b.dataset.angle;draw()}));draw();
</script></html>
