<section id="login"><p class="eyebrow">第七讲</p><h1>加入课堂</h1><p class="muted">首次填写姓名和学号；以后在同一浏览器自动保持登录。</p>
<form id="login-form"><label>姓名<input name="name" autocomplete="name" required maxlength="40"></label><label>学号<input name="studentNumber" autocomplete="username" inputmode="text" required maxlength="32"></label><button class="primary" type="submit">进入课堂</button></form><p class="fine">用于关联课堂作答记录。教师可查看姓名、学号和答案，公开统计不展示个人信息。姓名与学号用于课堂身份登记。</p></section>
<section id="workspace" hidden><div class="question-head" role="region" aria-label="当前题号与剩余时间"><div class="question-context"><strong id="question-number">等待发题</strong><p id="state" class="eyebrow">等待老师发题</p></div><div class="time-remaining"><span class="timer-label">剩余时间</span><strong id="timer" role="timer" aria-live="off">—</strong></div></div><div class="identity"><span id="profile"></span><button id="logout" class="text-button">退出登录</button></div><nav class="student-nav" aria-label="学生页面"><a id="live-link" aria-current="page">课堂作答</a><a id="my-answers">我的答题</a></nav><h1 id="title"></h1><p id="stem" class="stem"></p><div id="math" class="math"></div><p id="reference" class="fine"></p><form id="answer-form"><fieldset id="choices"><legend class="sr-only">选择一个答案</legend></fieldset><button id="submit" type="submit" class="primary" disabled>提交答案</button></form><p id="receipt" role="status"></p><div id="result" role="region" aria-label="本题结果与解析" aria-live="polite" hidden></div><section id="reason-panel" class="reason-panel" hidden aria-labelledby="reason-heading"><h2 id="reason-heading" tabindex="-1">选择原因 <span class="optional-label">可选</span></h2><p id="reason-for" class="fine"></p><p id="reason-hint" class="fine">选最接近你原本想法的一项，也可以只写自己的理由。不填写也算完成。</p><form id="reason-form"><fieldset id="reason-choices"><legend class="sr-only">选择一条主要原因</legend></fieldset><div id="other-reason-wrap"><label class="other-reason-label" for="other-reason-text">补充你的想法（可选，最多300字）</label><textarea id="other-reason-text" maxlength="300" rows="3" placeholder="可以补充所选原因，也可以不选上面的项目，直接写自己的思路或不明白的地方。"></textarea></div><div class="reason-actions"><button id="save-reason" type="submit" class="primary" disabled>保存原因与补充</button><button id="clear-reason" type="button" hidden>清除原因</button></div></form><p id="reason-receipt" role="status"></p></section></section>
