<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>量子光学 · 课堂作答</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="vendor/katex/katex.min.css"><script defer src="vendor/katex/katex.min.js"></script><script defer src="config.js"></script><script defer src="api.js"></script><script defer src="student.js"></script></head>
<body><header><a href="../index.html">量子光学</a><span>课堂作答</span></header><main class="student">
<p id="environment" class="notice" hidden></p><p id="message" class="message" role="status" aria-live="polite"></p>
<section id="login"><p class="eyebrow">第七讲</p><h1>加入课堂</h1><p class="muted">首次填写姓名和学号；以后在同一浏览器自动保持登录。</p>
<form id="login-form"><label>姓名<input name="name" autocomplete="name" required maxlength="40"></label><label>学号<input name="studentNumber" autocomplete="username" inputmode="text" required maxlength="32"></label><button class="primary" type="submit">进入课堂</button></form><p class="fine">用于关联课堂作答记录。教师可查看姓名、学号和答案，公开统计不展示个人信息。姓名与学号用于课堂身份登记。</p></section>
<section id="workspace" hidden><div class="identity"><span id="profile"></span><button id="logout" class="text-button">退出登录</button></div><div class="question-head"><p id="state" class="eyebrow">等待老师发题</p><strong id="timer"></strong></div><h1 id="title"></h1><p id="stem" class="stem"></p><div id="math" class="math"></div><p id="reference" class="fine"></p><form id="answer-form"><fieldset id="choices"><legend class="sr-only">选择一个答案</legend></fieldset><button id="submit" type="submit" class="primary" disabled>提交答案</button></form><p id="receipt" role="status"></p><div id="result" hidden></div></section>
</main></body></html>
