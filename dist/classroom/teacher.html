<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>量子光学 · 课后管理</title><link rel="stylesheet" href="style.css?v=20261102-feedback"><link rel="stylesheet" href="history.css?v=20261101-history"><script defer src="config.js"></script><script defer src="api.js"></script><script defer src="vendor/qrcode.js"></script><link rel="stylesheet" href="comparison.css?v=20261101-multiround"><script defer src="comparison-view.js?v=20261101-multiround"></script><script defer src="export-csv.js?v=20261101-multiround"></script><script defer src="teacher.js?v=20261107-sessions"></script></head><body>
<header><a href="../index.html" target="_blank" rel="noopener">量子光学</a><span>课后管理</span></header><main>
<p id="environment" class="notice" hidden></p><p id="message" class="message" role="status" aria-live="polite"></p>
<section id="login" class="teacher-login"><p class="eyebrow">教师入口</p><h1>课后管理</h1><p class="muted">登录后选择课堂，导出作答记录或统一开放答案与解析。</p><form id="login-form"><label>教师口令<input name="password" type="password" autocomplete="current-password" required maxlength="200"></label><button class="primary" type="submit">登录</button></form><button id="dev-login" hidden>本机演示登录</button></section>
<section id="workspace" hidden><div class="identity"><span>教师已登录</span><button id="logout" class="text-button">退出登录</button></div>
<div class="room-picker"><select id="rooms" aria-label="选择课堂"><option value="">选择课堂</option></select><button id="create">新建课堂</button></div>
<div id="classroom" hidden class="teacher-grid"><section><p id="round-label" class="eyebrow">尚未发题</p><h1 id="title" class="teacher-title"></h1><p id="stem" class="answer-text"></p>
<p id="status" class="status-line"></p><div class="toolbar"><button id="open" class="primary">发题 · 60秒</button><button id="extend" disabled>加30秒</button><button id="close" disabled>结束作答</button><button id="reveal" disabled>公布统计</button></div>
<div id="stats" hidden><div id="counts" class="counts"></div><p id="stats-note" class="stats-note"></p><p id="explanation" class="answer-text" hidden></p></div>
<div class="toolbar"><button id="analysis" disabled>显示解析</button><button id="export">导出本课堂记录</button></div><details id="reason-report" class="reason-report"><summary>选择原因统计（教师可见）</summary><p class="fine">按本轮各选项统计选择原因。此区域不出现在课件投影中；可在需要时更新。</p><button id="refresh-reasons" type="button">更新原因统计</button><div id="reason-summary"></div></details><details id="analysis-report" class="reason-report"><summary>各轮对比与详细AI分析（教师可见）</summary><p class="fine">先在课件中展示结果，再查看。详细原因和文字补充不进入课堂投影。</p><button id="refresh-analysis" type="button" disabled>更新／生成详细分析</button><div id="comparison-charts"></div><section id="teacher-ai-brief" class="ai-brief"></section><div id="analysis-detail"></div></details><section class="answer-release"><h2>课后开放</h2><p id="answers-release-status" class="fine" role="status"></p><button id="answers-release">开放答案与解析</button><div id="release-confirm" hidden><p>确认向本课堂学生开放正确答案与解析？</p><div class="toolbar"><button id="release-confirm-yes" class="primary">确认开放</button><button id="release-cancel">取消</button></div></div></section><p class="fine">导出包含全部轮次的题目、选项、正确答案、对错、解析与选择原因，每人每轮保留最后一次提交；公式以 LaTeX 文本保留。</p><p id="download-status" class="fine" role="status"></p></section>
<aside><h2>学生扫码进入</h2><canvas id="qr" aria-label="课堂二维码"></canvas><p><a id="student-link" target="_blank" rel="noopener">打开学生页</a></p><button id="copy-link">复制学生链接</button><p class="fine">同一课堂始终使用这个入口；刷新或重新发题不会清空往轮记录。</p></aside></div>
</section></main></body></html>
