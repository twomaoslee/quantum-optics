.title{font-size:25px;font-weight:650}.note{font-size:19px;fill:#526477}.rule{stroke:#87a7c1;stroke-width:2;fill:none}.divider{stroke:#d7e1e9;stroke-width:1;fill:none}.blue{fill:#1e5f96}
