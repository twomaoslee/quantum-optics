<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 664" role="img" aria-labelledby="title desc">
<title id="title">Alice测H/V后的两条同答分支</title><desc id="desc">两种Alice结果各占一半；Bob对应H或V。同答分别要求Bob测得+1或−1；两次偏振投影夹角相同。</desc>
<style>text{font-family:'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif;font-size:21px;fill:#202b38}.label{font-size:19px}.blue{fill:#1e5f96}.math{font-family:'STIX Two Math','Times New Roman',serif;font-style:italic;font-size:22px}.arrow{stroke:#8da5b8;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#8da5b8" stroke-width="1.3"/></marker></defs><rect width="480" height="664" fill="white"/>
<rect x="6" y="21" width="468" height="260" rx="4" fill="#f3f6fa"/>
<text x="92" y="55" class="label blue" text-anchor="middle">Alice 的记录</text>
<text x="325" y="55" class="label blue" text-anchor="middle">这一分支中的 Bob</text>
<text x="92" y="128" class="" text-anchor="middle">＋1（H）</text>
<text x="92" y="160" class="label" text-anchor="middle">该分支占一半</text>
<path class="arrow" d="M168 135H230"/>
<line x1="275.00" y1="135.00" x2="375.00" y2="135.00" stroke="#526274" stroke-width="3" stroke-dasharray="7 5"/>
<line x1="281.70" y1="160.00" x2="368.30" y2="110.00" stroke="#1e5f96" stroke-width="3" />
<path d="M350.00 135.00 A25 25 0 0 0 346.65 122.50" fill="none" stroke="#526274" stroke-width="1.5"/>
<text x="381" y="143" class="label" text-anchor="start">H</text>
<text x="365" y="99" class="label blue" text-anchor="start">＋1方向</text>
<text x="359" y="126" class="math" text-anchor="start">β</text>
<text x="240" y="215" class="" text-anchor="middle">同答：Bob 测得＋1</text>
<text x="240" y="246" class="label" text-anchor="middle">两人结果（＋，＋）</text>
<rect x="6" y="311" width="468" height="260" rx="4" fill="#f3f6fa"/>
<text x="92" y="345" class="label blue" text-anchor="middle">Alice 的记录</text>
<text x="325" y="345" class="label blue" text-anchor="middle">这一分支中的 Bob</text>
<text x="92" y="418" class="" text-anchor="middle">−1（V）</text>
<text x="92" y="450" class="label" text-anchor="middle">该分支占一半</text>
<path class="arrow" d="M168 425H230"/>
<line x1="325.00" y1="475.00" x2="325.00" y2="375.00" stroke="#526274" stroke-width="3" stroke-dasharray="7 5"/>
<line x1="350.00" y1="468.30" x2="300.00" y2="381.70" stroke="#1e5f96" stroke-width="3" />
<path d="M325.00 400.00 A25 25 0 0 0 312.50 403.35" fill="none" stroke="#526274" stroke-width="1.5"/>
<text x="336" y="379" class="label" text-anchor="start">V</text>
<text x="218" y="382" class="label blue" text-anchor="start">−1方向</text>
<text x="307" y="393" class="math" text-anchor="start">β</text>
<text x="240" y="505" class="" text-anchor="middle">同答：Bob 测得−1</text>
<text x="240" y="536" class="label" text-anchor="middle">两人结果（−，−）</text>
<line x1="24" y1="604" x2="64" y2="604" stroke="#526274" stroke-width="3" stroke-dasharray="7 5"/>
<text x="76" y="611" class="label" text-anchor="start">Bob 的偏振</text>
<line x1="24" y1="637" x2="64" y2="637" stroke="#1e5f96" stroke-width="3"/>
<text x="76" y="644" class="label" text-anchor="start">Bob 检测的偏振方向（同答所需）</text>
</svg>
