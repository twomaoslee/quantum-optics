<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" role="img"><style>text{font-family:'Noto Sans CJK SC','Noto Sans',Arial,sans-serif; fill:#283443} .muted{fill:#64748b} .ink{stroke:#526274;stroke-width:2;fill:none} .teal{stroke:#0b8577;fill:none;stroke-width:2.6} .amber{stroke:#c07b29;fill:none;stroke-width:2.6} .note{font-size:14px}</style><rect width="900" height="250" fill="white"/>
<text x="450" y="25" text-anchor="middle" font-size="20" font-weight="700">从 EPR 之问到 2022 年诺贝尔物理学奖</text>
