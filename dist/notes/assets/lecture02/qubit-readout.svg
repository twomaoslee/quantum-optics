<svg xmlns="http://www.w3.org/2000/svg" width="960" height="355" viewBox="0 0 960 355" role="img" aria-labelledby="title"><title id="title">制备、偏振分析与单次读出</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#0070c0" stroke-width="1.5"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="32" y="42" font-size="28" fill="#0070c0" text-anchor="start" font-weight="bold">制备</text><text x="374" y="42" font-size="28" fill="#0070c0" text-anchor="start" font-weight="bold">分析</text><text x="765" y="42" font-size="28" fill="#0070c0" text-anchor="start" font-weight="bold">记录</text><rect x="30" y="164" width="230" height="100" rx="8" fill="#eaf3fa" stroke="#c3d6e5"/><text x="145" y="204" font-size="26" fill="#202a33" text-anchor="middle" font-weight="normal">每次一个光子</text><text x="145" y="242" font-size="24" fill="#617585" text-anchor="middle" font-weight="normal">选择偏振状态</text><line x1="260" y1="214" x2="365" y2="214" stroke="#0070c0" stroke-width="3" marker-end="url(#arrow)"/><rect x="370" y="160" width="185" height="110" rx="8" fill="#eaf3fa" stroke="#c3d6e5"/><text x="462" y="201" font-size="28" fill="#0070c0" text-anchor="middle" font-weight="normal">H/V</text><text x="462" y="241" font-size="25" fill="#202a33" text-anchor="middle" font-weight="normal">偏振分束器</text><line x1="555" y1="214" x2="737" y2="214" stroke="#0070c0" stroke-width="3" marker-end="url(#arrow)"/><line x1="462" y1="160" x2="462" y2="94" stroke="#0070c0" stroke-width="3" marker-end="url(#arrow)"/><line x1="462" y1="86" x2="737" y2="86" stroke="#0070c0" stroke-width="3" marker-end="url(#arrow)"/><rect x="748" y="49" width="175" height="75" rx="8" fill="#fff" stroke="#c3d6e5"/><text x="835" y="80" font-size="24" fill="#202a33" text-anchor="middle" font-weight="normal">V口探测器</text><text x="835" y="109" font-size="24" fill="#0070c0" text-anchor="middle" font-weight="normal">记录 1</text><rect x="748" y="176" width="175" height="75" rx="8" fill="#fff" stroke="#c3d6e5"/><text x="835" y="207" font-size="24" fill="#202a33" text-anchor="middle" font-weight="normal">H口探测器</text><text x="835" y="237" font-size="24" fill="#0070c0" text-anchor="middle" font-weight="normal">记录 0</text><text x="593" y="191" font-size="22" fill="#617585" text-anchor="start" font-weight="normal">H输出</text><text x="589" y="71" font-size="22" fill="#617585" text-anchor="start" font-weight="normal">V输出</text><text x="32" y="325" font-size="25" fill="#202a33" text-anchor="start" font-weight="normal">0和1标记偏振读出，不表示光子的有无。</text></g></svg>