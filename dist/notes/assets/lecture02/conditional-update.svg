<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title"><title id="title">从选择结果到下一次分析的状态更新</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#0070c0" stroke-width="1.5"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="25" y="38" font-size="28" fill="#0070c0" text-anchor="start" font-weight="bold">沿选定结果继续：下一步使用条件态</text><rect x="25" y="145" width="133" height="75" rx="8" fill="#eaf3fa" stroke="#c3d6e5"/><text x="91" y="191" font-size="26" fill="#202a33" text-anchor="middle" font-weight="normal">输入 |ψ⟩</text><line x1="158" y1="182" x2="220" y2="182" stroke="#0070c0" stroke-width="3" marker-end="url(#arrow)"/><rect x="229" y="125" width="182" height="113" rx="8" fill="#eaf3fa" stroke="#c3d6e5"/><text x="320" y="170" font-size="25" fill="#202a33" text-anchor="middle" font-weight="normal">理想分析器</text><text x="320" y="210" font-size="26" fill="#0070c0" text-anchor="middle" font-weight="normal">a / a⊥</text><line x1="411" y1="163" x2="518" y2="100" stroke="#0070c0" stroke-width="3" marker-end="url(#arrow)"/><line x1="411" y1="214" x2="518" y2="285" stroke="#0070c0" stroke-width="3" marker-end="url(#arrow)"/><text x="418" y="112" font-size="22" fill="#617585" text-anchor="start" font-weight="normal">概率 pₐ</text><rect x="528" y="59" width="171" height="85" rx="8" fill="#fff" stroke="#c3d6e5"/><text x="613" y="94" font-size="24" fill="#202a33" text-anchor="middle" font-weight="normal">保留a分支</text><text x="613" y="127" font-size="24" fill="#0070c0" text-anchor="middle" font-weight="normal">当前态 |a⟩</text><line x1="699" y1="100" x2="747" y2="100" stroke="#0070c0" stroke-width="3" marker-end="url(#arrow)"/><rect x="758" y="59" width="178" height="85" rx="8" fill="#eaf3fa" stroke="#c3d6e5"/><text x="847" y="95" font-size="23" fill="#202a33" text-anchor="middle" font-weight="normal">下一台分析器</text><text x="847" y="127" font-size="21" fill="#617585" text-anchor="middle" font-weight="normal">再算条件概率</text><line x1="522" y1="252" x2="522" y2="314" stroke="#202a33" stroke-width="7"/><text x="550" y="292" font-size="25" fill="#617585" text-anchor="start" font-weight="normal">丢弃另一支</text><text x="25" y="360" font-size="24" fill="#617585" text-anchor="start" font-weight="normal">末端探测形成记录；若粒子被吸收，就没有继续传播的粒子。</text></g></svg>