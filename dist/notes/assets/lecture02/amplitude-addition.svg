<svg xmlns="http://www.w3.org/2000/svg" width="960" height="401" viewBox="0 0 960 401" role="img" aria-labelledby="title"><title id="title">+ 出口相加与− 出口抵消的概率幅计算</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#0070c0" stroke-width="1.5"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="28" y="40" font-size="28" fill="#0070c0" text-anchor="start" font-weight="bold">输入为45°：同一结果内先加振幅</text><rect x="20" y="82" width="920" height="140" rx="8" fill="#eaf3fa" stroke="#c3d6e5"/><text x="42" y="160" font-size="28" fill="#0070c0" text-anchor="start" font-weight="normal">+ 出口</text><text x="295" y="127" font-size="21" fill="#617585" text-anchor="middle" font-weight="normal">H贡献    V贡献</text><text x="295" y="171" font-size="35" fill="#202a33" text-anchor="middle" font-weight="normal">½  +  ½</text><line x1="443" y1="156" x2="534" y2="156" stroke="#0070c0" stroke-width="3" marker-end="url(#arrow)"/><text x="582" y="126" font-size="23" fill="#617585" text-anchor="middle" font-weight="normal">合振幅</text><text x="582" y="173" font-size="35" fill="#0070c0" text-anchor="middle" font-weight="normal">1</text><line x1="636" y1="156" x2="735" y2="156" stroke="#0070c0" stroke-width="3" marker-end="url(#arrow)"/><text x="687" y="129" font-size="20" fill="#617585" text-anchor="middle" font-weight="normal">模平方</text><text x="828" y="126" font-size="23" fill="#617585" text-anchor="middle" font-weight="normal">概率</text><text x="828" y="173" font-size="35" fill="#0070c0" text-anchor="middle" font-weight="normal">1</text><rect x="20" y="240" width="920" height="140" rx="8" fill="#eaf3fa" stroke="#c3d6e5"/><text x="42" y="318" font-size="28" fill="#0070c0" text-anchor="start" font-weight="normal">− 出口</text><text x="295" y="285" font-size="21" fill="#617585" text-anchor="middle" font-weight="normal">H贡献    V贡献</text><text x="295" y="329" font-size="35" fill="#202a33" text-anchor="middle" font-weight="normal">½  −  ½</text><line x1="443" y1="314" x2="534" y2="314" stroke="#0070c0" stroke-width="3" marker-end="url(#arrow)"/><text x="582" y="284" font-size="23" fill="#617585" text-anchor="middle" font-weight="normal">合振幅</text><text x="582" y="331" font-size="35" fill="#0070c0" text-anchor="middle" font-weight="normal">0</text><line x1="636" y1="314" x2="735" y2="314" stroke="#0070c0" stroke-width="3" marker-end="url(#arrow)"/><text x="687" y="287" font-size="20" fill="#617585" text-anchor="middle" font-weight="normal">模平方</text><text x="828" y="284" font-size="23" fill="#617585" text-anchor="middle" font-weight="normal">概率</text><text x="828" y="331" font-size="35" fill="#0070c0" text-anchor="middle" font-weight="normal">0</text></g></svg>