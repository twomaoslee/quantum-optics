<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>换坐标，还是实际改变偏振方向？</title><link rel="stylesheet" href="interactive.css"><body><main><h1>换坐标，还是实际改变偏振方向？</h1>
<p>初始偏振方向与实验室H方向成30°。两栏共用角度调节，但执行不同动作。</p>
<div class="controls"><label for="turn">转角</label><input id="turn" type="range" min="0" max="90" value="0"><output id="degrees">0°</output><button id="reset">回到起点</button></div>
<div class="grid2"><section class="card"><h2>只改坐标写法</h2><p class="muted">蓝色态矢量固定；灰色参考基转动。</p><svg id="passive" class="diagram" viewBox="0 0 320 280" role="img" aria-label="态固定而参考基转动"></svg><p id="coordinates"></p><p>实验室H分析器保持不动：<br><strong>P(H) = 75%，始终不变</strong></p></section><section class="card"><h2>实际改变偏振方向</h2><p class="muted">H/V参考基固定；蓝色态矢量转动。</p><svg id="active" class="diagram" viewBox="0 0 320 280" role="img" aria-label="参考基固定而偏振态改变"></svg><p id="preparation"></p><p>同一台H分析器：<br><strong id="probability"></strong></p></section></div>
<p class="hint">这里只画实系数的线偏振态平面。灰色箭头是数学参考基，转动它不表示转动实验装置。如果实际转动分析器，所测的基也会改变，需另算与该测量方向的重叠。</p>
<script>
const $=id=>document.getElementById(id),r=Math.PI/180;
function diagram(id,alpha,beta){const el=$(id),X=a=>155+100*Math.cos(a*r),Y=a=>170-100*Math.sin(a*r);el.innerHTML='<defs><marker id="'+id+'arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#0070c0"/></marker></defs><circle cx="155" cy="170" r="100" fill="none" stroke="#e4ecf2"/><path d="M35 170H285 M155 270V35" stroke="#dfe6ec" stroke-dasharray="4 4"/><text x="287" y="176">H</text><text x="149" y="28">V</text>'+[beta,beta+90].map((a,i)=>'<line x1="155" y1="170" x2="'+X(a)+'" y2="'+Y(a)+'" stroke="#718697" stroke-width="2"/><text x="'+(155+119*Math.cos(a*r)-5)+'" y="'+(170-119*Math.sin(a*r)+5)+'">'+(id==='passive'?(i?'e₂':'e₁'):'')+'</text>').join('')+'<line x1="155" y1="170" x2="'+X(alpha)+'" y2="'+Y(alpha)+'" stroke="#0070c0" stroke-width="4" marker-end="url(#'+id+'arrow)"/><text x="20" y="20">偏振方向 '+alpha+'°</text>'}
function draw(){const b=+$('turn').value,alpha=30+b,c1=Math.cos((30-b)*r),c2=Math.sin((30-b)*r),p=Math.cos(alpha*r)**2;$('degrees').textContent=b+'°';diagram('passive',30,b);diagram('active',alpha,0);$('coordinates').textContent='新坐标：('+c1.toFixed(3)+', '+c2.toFixed(3)+')；偏振方向仍是30°。';$('preparation').textContent='偏振方向变为'+alpha+'°，在固定H/V基中展开。';$('probability').textContent='P(H) = '+(p*100).toFixed(1)+'%';window.labState={turn:b,passiveH:.75,activeH:p,coordinates:[c1,c2]};}
$('turn').oninput=draw;$('reset').onclick=()=>{$('turn').value=0;draw()};draw();
</script></main><script src="embed.js"></script></body></html>
