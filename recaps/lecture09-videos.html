<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="第九讲课后回顾：用两段短片复习光子关联与双光子干涉。">
  <title>第九讲 · 视频回顾 | 量子光学</title>
  <link rel="stylesheet" href="../site.css?v=title-enter-3">
  <style>
    .video-heading {
      padding: clamp(28px, 5vw, 56px) 0 24px;
      border-bottom: 2px solid var(--deep);
    }
    .video-heading h1 { font-size: clamp(1.9rem, 4vw, 2.8rem); margin-bottom: 12px; }
    .video-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 32px;
      padding: 28px 0 44px;
    }
    .video-list h2 { font-size: 1.2rem; }
    .video-list p { color: var(--muted); margin: 6px 0 14px; }
    .video-list video {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: var(--deep);
    }
    @media (min-width: 781px) {
      .video-list { row-gap: 0; }
      .video-list > section {
        display: grid;
        grid-row: span 3;
        grid-template-rows: subgrid;
      }
    }
    @media (max-width: 780px) {
      .video-list { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <a class="skip" href="#main">跳至视频</a>
  <header>
    <div class="shell topbar">
      <a class="brand" href="../index.html" aria-label="量子光学课程首页">
        <img src="../assets/csu-logo.png" alt="中南大学"><span>课程资料</span>
      </a>
      <nav aria-label="课程资料">
        <a href="../index.html#lecture09">返回第九讲资料</a>
      </nav>
    </div>
  </header>
  <main class="shell" id="main">
    <div class="video-heading">
      <p class="eyebrow">第九讲 · 光子关联与双光子干涉</p>
      <h1>课后回顾视频</h1>
      <p class="lede">用两段短片回顾光子关联与双光子干涉。</p>
    </div>
    <div class="video-list">
      <section data-note-section="s10" data-next="part4" data-next-label="HOM 实验" data-prompt="平均亮度相同的光源，两路探测事件在时间上怎样分布？">
        <h2 id="hbt-title">HBT 实验：光子怎样聚束与反聚束？</h2>
        <p>5 分 08 秒 · 回顾平均亮度相同的光源为何会有不同的符合计数。</p>
        <video controls playsinline preload="none" aria-labelledby="hbt-title"
               src="../slides/assets/video/hbt-class.mp4?v=e5f950b5ac"
               poster="lecture09-videos/hbt.jpg?v=e5f950b5ac"></video>
      </section>
      <section data-note-section="s16" data-next="part6" data-next-label="比较 HBT 与 HOM" data-prompt="把两个光子的到达时间逐渐错开，两端各响一次的机会怎样变化？">
        <h2 id="hom-title">HOM 实验：为什么两个光子会同端输出？</h2>
        <p>3 分 59 秒 · 回顾都透射与都反射的概率幅怎样相消，以及延迟怎样改变符合概率。</p>
        <video controls playsinline preload="none" aria-labelledby="hom-title"
               src="../slides/assets/video/hom-class.mp4?v=0155f7f277"
               poster="lecture09-videos/hom.jpg?v=0155f7f277"></video>
      </section>
    </div>
  </main>
  <footer><div class="shell"><span>中南大学 · 量子光学 · 2026 秋季</span><a href="../index.html#lecture09">返回第九讲资料 ↑</a></div></footer>
  <script>
    const recapVideos = document.querySelectorAll('.video-list video');
    for (const video of recapVideos) {
      video.addEventListener('play', () => {
        if (video.paused) return;
        for (const other of recapVideos) {
          if (other !== video && !other.paused) other.pause();
        }
      });
    }
  </script>
</body>
</html>
